name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job requests exactly what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job runs `npm install`, which executes third-party install scripts.
    # It gets read access only: it cannot mint an OIDC token or publish.
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Actions are pinned to full commit hashes, not tags, so a moved or
        # compromised tag cannot change what runs here. Dependabot keeps them
        # current and updates the version comments.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config where install scripts can read it.
          persist-credentials: false
      - name: Install, build, and upload site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish, and only from main (enforced by the
    # github-pages environment's deployment branch policy).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
